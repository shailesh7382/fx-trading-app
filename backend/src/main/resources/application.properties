server.port=8080
spring.application.name=fx-backend

# Verbose application diagnostics. Override with FX_BACKEND_LOG_LEVEL=INFO in quieter environments.
logging.level.com.example.fx.backend=${FX_BACKEND_LOG_LEVEL:DEBUG}

# The backend owns the H2 file and exposes it over TCP for external tooling.
spring.datasource.url=jdbc:h2:file:~/fxtradingapp;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
h2.tcp-server.enabled=true

# Business timezone used to define daily report boundaries.
reports.zone-id=${FX_REPORTS_ZONE_ID:Asia/Singapore}

# Generated OpenAPI HTTP clients connect the backend to the Trading System.
trading-system.client.base-url=http://localhost:8090
trading-system.client.connect-timeout=2s
trading-system.client.read-timeout=5s
trading-system.client.channel=WEB
trading-system.client.segment=C
trading-system.client.customer-id=0000123456
trading-system.client.callback-url=http://localhost:8080/api/resting-orders/events
trading-system.client.default-quantity=1000000
trading-system.client.instruments=EURUSD,GBPUSD,USDJPY,AUDUSD,USDCAD,NZDUSD,USDCHF,EURGBP,EURJPY,GBPJPY

# Identifier generation. Each deployable system gets its own leading letter, and each
# instance reserves counter values from the database a block at a time.
fx.id.system-identifier=B
fx.id.block-size=1000
