# Overrides applied to every service in this distribution.
#
# Each service also reads conf/<service>/application.properties, which wins over this file, so a
# single service can be retuned without touching the others. Both locations are optional.
#
# Examples:
#   server.port=8081
#   simulator.limit-orders.callback.allowed-prefixes[0]=http://backend.internal:8080/
#   logging.level.com.example.fx=DEBUG
