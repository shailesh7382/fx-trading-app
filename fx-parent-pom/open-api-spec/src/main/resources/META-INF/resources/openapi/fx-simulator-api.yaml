openapi: 3.0.3
info:
  title: FX Simulator API
  version: 1.1.0
  description: |
    Contract for requesting executable FX prices and booking simulated trades.
    A one-way request returns one flat executable price; a two-way request returns flat BUY and SELL fields.
    Quotes are single-use and expire at `expiresAt`.
servers:
  - url: http://localhost:8090
    description: Local simulator
tags:
  - name: Pricing
    description: Request and inspect executable FX quotes.
  - name: Booking
    description: Book a previously issued quote and inspect the resulting trade.
paths:
  /api/v1/pricing/quotes:
    post:
      tags: [Pricing]
      operationId: requestPrice
      summary: Request an executable FX quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceRequest'
      responses:
        '201':
          description: Executable quote created.
          headers:
            Location:
              description: URI of the created quote.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceQuote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/pricing/quotes/{quoteId}:
    get:
      tags: [Pricing]
      operationId: getPriceQuote
      summary: Get the current state of a quote
      parameters:
        - $ref: '#/components/parameters/QuoteId'
      responses:
        '200':
          description: Quote found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceQuote'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/bookings:
    post:
      tags: [Booking]
      operationId: bookTrade
      summary: Book a simulated trade from an active quote
      description: |
        `requestId` makes booking idempotent. Repeating the same request returns the
        original trade; reusing the id with different booking details returns a conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201':
          description: Trade booked.
          headers:
            Location:
              description: URI of the booked trade.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookedTrade'
        '200':
          description: The original trade returned for an idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookedTrade'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
  /api/v1/bookings/{tradeId}:
    get:
      tags: [Booking]
      operationId: getBooking
      summary: Get a booked trade
      parameters:
        - name: tradeId
          in: path
          required: true
          description: Simulator trade identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trade found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookedTrade'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    QuoteId:
      name: quoteId
      in: path
      required: true
      description: Simulator quote identifier.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: The request is malformed or violates the contract.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    UnprocessableEntity:
      description: The request is valid but the instrument is unsupported.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    NotFound:
      description: The requested quote or trade does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    Conflict:
      description: The quote was already booked or the idempotency key was reused inconsistently.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    Gone:
      description: The quote has expired and can no longer be booked.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
  schemas:
    PriceRequest:
      type: object
      additionalProperties: false
      description: |
        For `ONE_WAY`, `side` is required. For `TWO_WAY`, `side` must be omitted and the
        response contains flat BUY and SELL price fields. Side is expressed from the customer's
        perspective for `quantityCurrency`.
      required:
        - requestId
        - channel
        - segment
        - customerId
        - currencyPair
        - quantity
        - quantityCurrency
        - tenor
        - quoteType
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[A-Za-z0-9._:-]+$'
          example: price-request-20260908-0001
        channel:
          type: string
          minLength: 1
          maxLength: 20
          example: WEB
        segment:
          type: string
          minLength: 1
          maxLength: 1
          example: C
        customerId:
          type: string
          minLength: 10
          maxLength: 10
          example: '0000123456'
        currencyPair:
          type: string
          pattern: '^[A-Z]{6}$'
          example: EURUSD
          description: Six-character ISO currency pair, with base currency first.
        quantity:
          type: number
          minimum: 0
          exclusiveMinimum: true
          example: 1000000
          description: Quantity of `quantityCurrency` to buy or sell.
        quantityCurrency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: EUR
          description: Currency whose quantity and side are specified; must be one leg of currencyPair.
        tenor:
          $ref: '#/components/schemas/Tenor'
        quoteType:
          $ref: '#/components/schemas/QuoteType'
        side:
          $ref: '#/components/schemas/Side'
    BookingRequest:
      type: object
      additionalProperties: false
      required: [requestId, channel, segment, customerId, quoteId, side]
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[A-Za-z0-9._:-]+$'
          example: booking-request-20260908-0001
          description: Caller-generated idempotency key for this booking.
        channel:
          type: string
          minLength: 1
          maxLength: 20
          example: WEB
        segment:
          type: string
          minLength: 1
          maxLength: 1
          example: C
        customerId:
          type: string
          minLength: 10
          maxLength: 10
          example: '0000123456'
        quoteId:
          type: string
          format: uuid
        side:
          $ref: '#/components/schemas/Side'
    PriceQuote:
      type: object
      additionalProperties: false
      required:
        - requestId
        - responseId
        - responseAt
        - channel
        - segment
        - customerId
        - quoteId
        - currencyPair
        - quantity
        - quantityCurrency
        - tenor
        - quoteType
        - valueDate
        - quotedAt
        - expiresAt
        - status
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[A-Za-z0-9._:-]+$'
          description: Echo of the pricing request identifier.
        responseId:
          type: string
          format: uuid
        responseAt:
          type: string
          format: date-time
        channel:
          type: string
          minLength: 1
          maxLength: 20
        segment:
          type: string
          minLength: 1
          maxLength: 1
        customerId:
          type: string
          minLength: 10
          maxLength: 10
        quoteId:
          type: string
          format: uuid
        currencyPair:
          type: string
          pattern: '^[A-Z]{6}$'
        quantity:
          type: number
          minimum: 0
          exclusiveMinimum: true
        quantityCurrency:
          type: string
          pattern: '^[A-Z]{3}$'
        tenor:
          $ref: '#/components/schemas/Tenor'
        quoteType:
          $ref: '#/components/schemas/QuoteType'
        side:
          $ref: '#/components/schemas/Side'
        coverPrice:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: ONE_WAY simulated all-in market price before customer markup.
        clientPrice:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: ONE_WAY executable all-in price offered to the customer.
        swapPoints:
          type: number
          description: ONE_WAY forward points in outright-rate units.
        buyCoverPrice:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: TWO_WAY cover price for buying quantityCurrency.
        buyClientPrice:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: TWO_WAY client price for buying quantityCurrency.
        buySwapPoints:
          type: number
          description: TWO_WAY forward points for buying quantityCurrency.
        sellCoverPrice:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: TWO_WAY cover price for selling quantityCurrency.
        sellClientPrice:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: TWO_WAY client price for selling quantityCurrency.
        sellSwapPoints:
          type: number
          description: TWO_WAY forward points for selling quantityCurrency.
        valueDate:
          type: string
          format: date
        quotedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/QuoteStatus'
    BookedTrade:
      type: object
      additionalProperties: false
      required:
        - requestId
        - responseId
        - responseAt
        - channel
        - segment
        - customerId
        - tradeId
        - quoteId
        - currencyPair
        - quantity
        - quantityCurrency
        - tenor
        - side
        - coverPrice
        - clientPrice
        - swapPoints
        - valueDate
        - bookedAt
        - status
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[A-Za-z0-9._:-]+$'
          description: Echo of the booking request identifier.
        responseId:
          type: string
          format: uuid
        responseAt:
          type: string
          format: date-time
        channel:
          type: string
          minLength: 1
          maxLength: 20
        segment:
          type: string
          minLength: 1
          maxLength: 1
        customerId:
          type: string
          minLength: 10
          maxLength: 10
        tradeId:
          type: string
          format: uuid
        quoteId:
          type: string
          format: uuid
        currencyPair:
          type: string
          pattern: '^[A-Z]{6}$'
        quantity:
          type: number
          minimum: 0
          exclusiveMinimum: true
        quantityCurrency:
          type: string
          pattern: '^[A-Z]{3}$'
        tenor:
          $ref: '#/components/schemas/Tenor'
        side:
          $ref: '#/components/schemas/Side'
        coverPrice:
          type: number
          minimum: 0
          exclusiveMinimum: true
        clientPrice:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Executed customer price.
        swapPoints:
          type: number
        valueDate:
          type: string
          format: date
        bookedAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/TradeStatus'
    ApiProblem:
      type: object
      additionalProperties: false
      required: [responseId, responseAt, type, title, status, detail, errorCode]
      properties:
        responseId:
          type: string
          format: uuid
        responseAt:
          type: string
          format: date-time
        type:
          type: string
          format: uri
          example: urn:problem:fx-simulator:quote-expired
        title:
          type: string
          example: Quote expired
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
        errorCode:
          type: string
          example: QUOTE_EXPIRED
    Tenor:
      type: string
      enum: [SPOT, ONE_WEEK, ONE_MONTH, THREE_MONTHS, SIX_MONTHS, ONE_YEAR]
    QuoteType:
      type: string
      enum: [ONE_WAY, TWO_WAY]
    Side:
      type: string
      description: BUY or SELL `quantityCurrency` from the customer's perspective.
      enum: [BUY, SELL]
    QuoteStatus:
      type: string
      enum: [ACTIVE, BOOKED, EXPIRED]
    TradeStatus:
      type: string
      enum: [BOOKED]
