spring.application.name=fx-simulator
server.port=8090

# Verbose application diagnostics. Override with FX_SIMULATOR_LOG_LEVEL=INFO in quieter environments.
logging.level.com.example.fx.simulator=${FX_SIMULATOR_LOG_LEVEL:DEBUG}

simulator.quote-ttl=30s
simulator.state.max-quotes=10000
simulator.state.max-trades=10000
simulator.state.max-idempotency-keys=10000
simulator.state.quote-retention=5m
simulator.state.trade-retention=24h
simulator.state.idempotency-retention=24h
simulator.state.cleanup-interval=60s
simulator.resting-orders.max-orders=10000
simulator.resting-orders.retention=24h
simulator.resting-orders.evaluation-interval=250ms
simulator.resting-orders.dispatch-interval=200ms
simulator.resting-orders.cleanup-interval=60s
# The simulator only ever posts order events to a configured prefix.
simulator.resting-orders.callback.allowed-prefixes[0]=http://localhost:8080/
simulator.resting-orders.callback.max-attempts=5
simulator.resting-orders.callback.initial-backoff=1s
simulator.resting-orders.callback.timeout=5s
# Evaluation, callback delivery, and state cleanup must not queue behind one another.
spring.task.scheduling.pool.size=4
simulator.settlement.spot-lags.USDCAD=1
# Synthetic settlement calendars exclude weekends; currency holidays can be configured as ISO dates.
# simulator.settlement.holidays.USD[0]=2026-12-25
spring.jackson.deserialization.fail-on-unknown-properties=true

# Serve the authored contract from the open-api-spec dependency in Swagger UI.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.url=/openapi/fx-trading-systems-api.yaml
